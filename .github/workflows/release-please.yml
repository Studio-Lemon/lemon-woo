name: Release Please

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            # A PAT is required (not the default GITHUB_TOKEN): releases created with the
            # default token do not trigger other workflows, which would prevent release.yml
            # from firing on `release: published` and building/deploying the plugin.
            - uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
